name: Daily DD paper trade and Discord post

# Russ, 2026-10-29: post the first lines of the daily summary to the StrikeOut Discord every day at 3 PM Eastern.
# Two crons per step so one of them lands on the Eastern hour on either side of the clock change; the guard
# step (tools/ny_hour_guard.py) picks the step from the America/New_York hour and the other run does nothing.
# Secrets: ODDS_API_KEY, DISCORD_WEBHOOK_URL. Outputs are committed back to the repository as the strikeout
# bot's Action does. Paper stakes only.
on:
  schedule:
    - cron: "0 19 * * *"    # 3 PM Eastern during daylight time: grade, daily run, post
    - cron: "0 20 * * *"    # 3 PM Eastern during standard time
    - cron: "40 22 * * *"   # 6:40 PM Eastern during daylight time: pre-tip snapshot of the picked games
    - cron: "40 23 * * *"   # 6:40 PM Eastern during standard time
  workflow_dispatch:
    inputs:
      step:
        description: "auto (by New York hour), daily, pretip, or post_test (dry chain, then one labeled test post)"
        required: false
        default: "auto"

permissions:
  contents: write

concurrency:
  group: daily-dd
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      STEP: ${{ github.event.inputs.step || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install
        run: pip install -r requirements-ci.txt

      - name: Which step (New York hour)
        id: guard
        run: python tools/ny_hour_guard.py

      - name: Grade yesterday
        if: steps.guard.outputs.step == 'daily' || steps.guard.outputs.step == 'post_test'
        run: python tools/grade.py

      - name: Daily run (features, prices, edge picks)
        if: steps.guard.outputs.step == 'daily' || steps.guard.outputs.step == 'post_test'
        run: python tools/daily_run.py

      - name: Post the five most likely double-doubles to Discord
        if: steps.guard.outputs.step == 'daily'
        run: |
          python tools/top_post.py
          python tools/post_discord.py --kind top --post

      - name: One labeled test post
        if: steps.guard.outputs.step == 'post_test'
        run: |
          python tools/top_post.py
          python tools/post_discord.py --kind top --post --label test

      - name: Pre-tip snapshot of the picked games
        if: steps.guard.outputs.step == 'pretip'
        run: python tools/pretip_snapshot.py

      - name: Commit outputs
        if: steps.guard.outputs.step != 'none'
        run: |
          git config user.name "dd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/paper data/odds data/models/production
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "paper trade $(date -u +%F) ${{ steps.guard.outputs.step }}"
            git pull --rebase
            git push
          fi
