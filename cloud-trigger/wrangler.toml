name = "dd-bot-trigger"
main = "worker.js"
compatibility_date = "2024-09-23"

[vars]
GITHUB_REPO = "gazette1/double-double"
GITHUB_WORKFLOW = "daily_dd_discord.yml"
GITHUB_REF = "main"

# UTC. Every trigger dispatches step=auto and tools/ci_gate.py decides from the New York clock, so one list serves
# both sides of the clock change (see README.md). Four expressions, four of the five free Cron Triggers.
[triggers]
crons = ["55 18-20 * * *", "25 19-20 * * *", "40 22-23 * * *", "10 23,0 * * *"]

# Secret, not set here:  npx wrangler secret put GITHUB_TOKEN
